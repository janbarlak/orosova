name: Prixi Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        run: python monitor.py

      - name: Check existing issue
        id: check_issue
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            const existing = issues.data.find(
              i => i.title === 'Prixi - voľný termín'
            );

            core.setOutput(
              'exists',
              existing ? 'true' : 'false'
            );

      - name: Create issue
        if: hashFiles('issue.txt') != '' && steps.check_issue.outputs.exists != 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Prixi - voľný termín
          content-filepath: issue.txt
