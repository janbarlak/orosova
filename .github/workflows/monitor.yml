name: Prixi Monitor

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        run: python monitor.py

      - name: Create issue
        if: hashFiles('issue.txt') != ''
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Prixi - voľný termín
          content-filepath: issue.txt
